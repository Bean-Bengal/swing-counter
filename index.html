<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swing Counter</title>
<style>
*{box-sizing:border-box}
body{font-family:sans-serif;margin:0 auto;padding:16px;background:#f4efe6;color:#222;max-width:520px}
h1{font-size:1.4rem}
textarea{width:100%;min-height:90px;font-size:1rem;padding:8px}
button{min-height:44px;padding:0 16px;font-size:1rem;margin-top:8px}
#out{font-size:2rem;margin-top:12px}
</style></head><body>
<script data-bean-store>(function(){if(typeof location!=='undefined'&&location&&location.protocol==='about:'&&typeof document!=='undefined'&&document.addEventListener){document.addEventListener('click',function(e){var a=e.target&&e.target.closest&&e.target.closest('a[href^="#"]');if(!a||a.target==='_blank')return;e.preventDefault();try{location.hash=a.getAttribute('href')}catch(x){}},true)}if(typeof window==='undefined')return;try{window.localStorage.getItem('x');return}catch(e){}var d=Object.assign({},window.__BEAN_SAVED||{});function post(){try{parent.postMessage({type:'bean-store',data:d},'*')}catch(e){}}var ls={getItem:function(k){return Object.prototype.hasOwnProperty.call(d,k)?d[k]:null},setItem:function(k,v){d[k]=String(v);post()},removeItem:function(k){delete d[k];post()},clear:function(){d={};post()},key:function(i){return Object.keys(d)[i]||null}};Object.defineProperty(ls,'length',{get:function(){return Object.keys(d).length}});try{Object.defineProperty(window,'localStorage',{value:ls,configurable:true})}catch(e){}})();</script>
<h1>Swing Counter</h1>
<p>Paste swing times in milliseconds, separated by commas or spaces. A full swing is 800 ms or longer.</p>
<textarea id="in" placeholder="800, 1200, 300, 950"></textarea>
<button id="go">Count</button>
<div id="out">-</div>
<script data-part="swing.js">
function makeCounter(twin){
  return function(times){
    var n=0;
    for(var i=0;i<times.length;i++){
      var t=times[i];
      if(typeof t!=="number"||isNaN(t))continue;
      if(twin?t>800:t>=800)n++;
    }
    return n;
  };
}
var countFullSwings=makeCounter(false);
var twinCount=makeCounter(true);
var CASES=[
  [[],0],
  [[800],1],
  [[799],0],
  [[800,1200,300],2],
  [[100,200,300],0],
  [[900,"x",NaN,801],2]
];
function allPass(fn){
  for(var i=0;i<CASES.length;i++){
    if(fn(CASES[i][0])!==CASES[i][1])return false;
  }
  return true;
}
window.swingOk=false;
try{
  window.swingOk=allPass(countFullSwings)&&!allPass(twinCount);
}catch(e){window.swingOk=false;}
document.getElementById("go").onclick=function(){
  var raw=document.getElementById("in").value.split(/[\s,]+/);
  var nums=[];
  for(var i=0;i<raw.length;i++){if(raw[i]!=="")nums.push(Number(raw[i]));}
  document.getElementById("out").textContent=countFullSwings(nums);
};

</script>
</body></html>
